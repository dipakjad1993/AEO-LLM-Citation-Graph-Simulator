name: ci
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: node --test src/node-orchestrator/utils/unitTests.js
      - run: node src/node-orchestrator/utils/testRunner.js
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-lite.txt
      - run: python -m spacy download en_core_web_sm || true
      - run: python -m pytest src/python-engine/tests/ -q
      - run: python seed_demo_data.py && python src/python-engine/main.py --run-dir data/output/run_demo
