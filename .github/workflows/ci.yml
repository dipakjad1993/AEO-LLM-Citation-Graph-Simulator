name: ci
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      # Hermetic unit tests only. testRunner.js is a LOCAL readiness gate
      # (requires .env + real brand in entity_maps.json) — it can never pass
      # on a fresh checkout, so it stays in `npm test` for developers, not CI.
      - run: node --test src/node-orchestrator/utils/unitTests.js
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-lite.txt
      - name: Install spaCy model (strict — fail loudly, no silent degrade)
        run: python -m spacy download en_core_web_sm && python -c "import spacy; spacy.load('en_core_web_sm'); print('spacy model OK')"
      # tests/ holds script-style readiness validators (pytest collects 0 tests
      # and exits 5) — the real hermetic gate is the eval goldens (exit 1/0).
      - run: python src/python-engine/tests/test_eval_goldens.py
      - name: Seed demo corpus
        run: python -u seed_demo_data.py
      - name: Run full demo pipeline (streams stage progress; traceback surfaced)
        # Seed rows are labelled demo_synthetic and quarantined by default —
        # the demo opts in explicitly via AEO_ALLOW_SYNTHETIC=1 (same as --run).
        run: python -u src/python-engine/main.py --run-dir data/output/run_demo
        env:
          AEO_ALLOW_SYNTHETIC: "1"
